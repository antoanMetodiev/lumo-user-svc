spring.application.name=lumo-user-svc

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health
server.port=8083

# Clerk (see README-CLERK.md) — only the webhook is verified here now; the
# session JWT itself is verified once, upstream, by lumo-api-gateway.
# CLERK_WEBHOOK_SECRET_LOCAL is optional — set it only in local dev (e.g. an
# ngrok-tunneled endpoint has its own signing secret) so the real
# CLERK_WEBHOOK_SECRET never has to be touched. Falls through to the real one
# whenever the local var isn't set (i.e. always, in production).
clerk.webhook-secret=${CLERK_WEBHOOK_SECRET_LOCAL:${CLERK_WEBHOOK_SECRET}}

# Shared secret proving a request came from lumo-api-gateway (which already
# verified the caller's Clerk session) rather than from anyone who found this
# service's URL — see GatewayAuthenticationFilter. Same value as the gateway's.
internal.service-secret=${INTERNAL_SERVICE_SECRET}

# Where lumo-api-gateway lives — used by GatewayClientConfig's RestClient to
# tell lumo-payments-svc (via the gateway) to delete its own copy of a
# deleted Clerk account. Same manual local/prod swap as the gateway's own
# Feign clients and lumo-payments-svc's own gateway.url right now: keep the
# active line pointed at localhost while developing, swap to the commented
# line before deploying.
#gateway.url=http://localhost:8080
gateway.url=https://lumo-api-gateway.onrender.com